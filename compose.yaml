services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pajaken_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8080"
    environment:
      APP_NAME: "${APP_NAME:-Pajaken}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-pajaken}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-root_secret}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pajaken_network
    deploy:
      resources:
        limits:
          memory: 512M

  mysql:
    image: mysql:8.4
    container_name: pajaken_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-pajaken}"
      MYSQL_USER: "pajaken_user"
      MYSQL_PASSWORD: "${DB_PASSWORD:-root_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-root_secret}"
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pajaken_network
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local

networks:
  pajaken_network:
    driver: bridge
